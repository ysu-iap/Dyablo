[run]
tEnd=0.25
output_timeslice=0.05    
initial_conditions=blast_MC,particle_grid
nStepmax=100
nOutput=20
output_frequency=5

[dt]
hydro_cfl=0.8

[amr]
level_min=5
level_max=5

epsilon_refine=0.1
epsilon_coarsen=0.05

markers_kernel=RefineCondition_pseudo_gradient

bx=4
by=4

load_balancing_frequency=10
cycle_frequency=5

[hydro]
;                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          
gamma0=1.666
riemann=hllc
update=HydroUpdate_hancock_MC

[mesh]
ndim=2

xmin=0.0
xmax=1.0

ymin=0.0
ymax=1.0

boundary_type_xmin=periodic
boundary_type_xmax=periodic

boundary_type_ymin=periodic
boundary_type_ymax=periodic

[particles]
update_position      = ParticleUpdate_tracers_move_MC

[particle_grid]
nx=4096
ny=4096

[blast]
density_in=1.0
density_out=1.2
radius=0.25

[output]
outputDir=./
outputPrefix=blast_2D_MC
write_variables=rho,rho_vx,rho_vy,e_tot
write_particle_variables = particles/vx,particles/vy,particles/mass