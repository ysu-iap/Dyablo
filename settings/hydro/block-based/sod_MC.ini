[run]                
tend=0.25                
output_timeslice=0.05                
initial_conditions=sod_MC,particle_grid            
nstepmax=1000
nOutput=100
output_frequency=1                

[dt]
hydro_cfl=0.8

[amr]
level_min=2
level_max=4

; coarse_oct_resolution_x=4
; coarse_oct_resolution_y=1

bx=4                   
by=4                   

markers_kernel=RefineCondition_pseudo_gradient

epsilon_coarsen=0.05                
epsilon_refine=0.1                

cycle_frequency=1                
load_balancing_frequency=50                  

nboctspergroup=1024                  

[hydro]                
gamma0=1.666               
riemann=hllc            
update=HydroUpdate_hancock_MC    

[mesh]
ndim=2

xmin=0.0                 
xmax=1.0                 

ymin=0.0                 
ymax=1.0                

boundary_type_xmax=periodic
boundary_type_xmin=periodic

boundary_type_ymax=periodic
boundary_type_ymin=periodic


[particles]
update_position      = ParticleUpdate_tracers_move_MC

[particle_grid]
nx=4096
ny=4096

[sod]
pl=1                   
pr=0.1
rhol=1                   
rhor=1               
x0=0.5

[output]
outputdir=./                  
outputprefix=test_sod_2D_MC
write_variables=rho,rho_vx,rho_vy,e_tot
write_particle_variables = particles/vx,particles/vy,particles/mass,particles/ipart